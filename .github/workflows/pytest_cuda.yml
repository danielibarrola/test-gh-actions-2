name: CI - Pytest CUDA
on:
  workflow_call:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: string
        default: "linux-x86-n4-16"
      python:
        description: "Which python version to test?"
        type: string
        default: "3.12"
      cuda-version:
        description: "Which CUDA version to test?"
        type: string
        default: "12.9"

permissions: {}


jobs:
  run-tests:
    defaults:
      run:
        # Set the shell to bash as GitHub actions run with /bin/sh by default
        shell: bash
    runs-on: ubuntu-latest
    name: "${{ (contains(inputs.runner, 'h100') && 'h100') ||
        (contains(inputs.runner, 'b200') && 'b200') ||
        (contains(inputs.runner, 'l4') && 'l4') }}, CUDA ${{ inputs.cuda-version }}, py ${{ inputs.python }}"

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Download CUDA wheels
        run: echo "Downloading CUDA wheels..."
      - name: Install Python dependencies
        run: |
          echo "Installing Python dependencies..."
      - name: Run Pytest CUDA tests
        timeout-minutes: 120
        run: |
          echo "Running Pytest CUDA tests..."
          exit 0